     .cloud {
    position: absolute;
    width: 120px;
    height: 40px;
    background: white;
    border-radius: 50px;
    opacity: 0.7;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    top: -25px;
    left: 20px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    top: -35px;
    right: 15px;
}

.cloud1 {
    top: 100px;
    left: 80px;
}

.cloud2 {
    top: 180px;
    right: 100px;
    transform: scale(0.8);
}

.cloud3 {
    top: 400px;
    left: 150px;
    transform: scale(0.6);
}
    </style>
</head>
<body>
    <div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
